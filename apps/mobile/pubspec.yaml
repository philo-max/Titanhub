name: titanhub
description: "Titanhub - ACG All-in-One Aggregation Platform"
publish_to: 'none'

version: 1.1.1+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.3

  # Network
  dio: ^5.4.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8

  # Database / Persistence
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  path_provider: ^2.1.5

  # Video / Media
  media_kit: ^1.1.10
  media_kit_video: ^1.1.10
  media_kit_libs_video: ^1.0.7

  # Playback page resolution (Android WebView)
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_android: ^1.1.3

  # UI / Helpers
  cached_network_image: ^3.3.1
  flutter_hooks: ^0.21.0
  lucide_icons_flutter: ^3.0.0
  flutter_js: ^0.8.0
  html: ^0.15.4
  xml: ^7.1.0
  xpath_selector_html_parser: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1



flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/plugins/
    - assets/kazumi/
    - assets/kazumi/rules/
    - assets/venera/
    - assets/venera/sources/
